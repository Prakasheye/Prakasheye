<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsFlash - Modern News Experience</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <div class="logo-container">
                    <span class="logo-icon"><i class="fas fa-newspaper"></i></span>
                    <h1 class="logo-text">NewsFlash</h1>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search news...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <nav class="category-nav">
                    <button class="category-btn active" data-category="general">General</button>
                    <button class="category-btn" data-category="technology">Technology</button>
                    <button class="category-btn" data-category="business">Business</button>
                    <button class="category-btn" data-category="science">Science</button>
                    <button class="category-btn" data-category="health">Health</button>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Featured News Section -->
            <section class="featured-news">
                <h2 class="section-title">Featured Stories</h2>
                <div class="featured-grid" id="featuredGrid">
                    <!-- Featured articles will be inserted here -->
                </div>
            </section>

            <!-- Latest News Section -->
            <section class="latest-news">
                <h2 class="section-title">Latest News</h2>
                <div class="news-grid" id="newsGrid">
                    <!-- News articles will be inserted here -->
                </div>
            </section>
        </main>

        <!-- Loading Animation -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <span class="loading-text">Loading News...</span>
            </div>
        </div>

        <!-- Notification Toast -->
        <div class="toast" id="toast">
            <div class="toast-content">
                <i class="toast-icon"></i>
                <span class="toast-message"></span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>© 2025 NewsFlash. Powered by NewsAPI</p>
                <div class="footer-links">
                    <a href="#" class="footer-link">About</a>
                    <a href="#" class="footer-link">Contact</a>
                    <a href="#" class="footer-link">Privacy Policy</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Article Template -->
    <template id="articleTemplate">
        <article class="news-card">
            <div class="card-image">
                <img src="" alt="Article thumbnail">
                <span class="category-tag"></span>
            </div>
            <div class="card-content">
                <h3 class="article-title"></h3>
                <p class="article-description"></p>
                <div class="article-meta">
                    <span class="source"></span>
                    <span class="published-date"></span>
                </div>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
</body>
</html>
